services:
  - type: web
    name: agro-haat-ai
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 18.20.0
      - key: SESSION_SECRET
        generateValue: true
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 3306
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: WEATHER_API_KEY
        sync: false
      - key: DATA_GOV_IN_API_KEY
        sync: false
      - key: BHASHINI_USER_ID
        sync: false
      - key: BHASHINI_API_KEY
        sync: false
      - key: BHASHINI_INFERENCE_KEY
        sync: false
      - key: BHASHINI_PIPELINE_ENDPOINT
        value: https://dhruva-api.bhashini.gov.in/services/inference/pipeline
      - key: BHASHINI_AUTH_ENDPOINT
        value: https://meity-auth.ulcacontrib.org/ulca/apis/v0/model/getModelsPipeline
